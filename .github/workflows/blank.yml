
name: Vion iOS Non-JIT Build

on:
  workflow_dispatch:
    inputs:
      ios_deployment_target:
        description: "Minimum iOS deployment target"
        required: true
        default: "16.0"
        type: choice
        options:
          - "16.0"
          - "17.0"
          - "18.0"

permissions:
  contents: read

concurrency:
  group: vion-ios-nonjit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vion for iOS
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euxo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
          cmake --version || brew install cmake
          git --version

      - name: Checkout Vion source and submodules
        uses: actions/checkout@v4
        with:
          repository: vion-app-org/Vion
          ref: native-ios-port
          path: source
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source tree
        shell: bash
        run: |
          set -euxo pipefail
          test -f source/CMakeLists.txt
          test -d source/.git
          git -C source submodule status
          echo "Top-level CMake options:"
          grep -nE 'option\\(|IOS|ARCHITECTURE' \
            source/CMakeLists.txt | head -100 || true

      - name: Fix OpenSSL iOS deployment target
        env:
          IOS_TARGET: ${{ inputs.ios_deployment_target }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("source/external/CMakeLists.txt")
          if not path.is_file():
              raise SystemExit(f"Missing expected file: {path}")

          text = path.read_text()
          replacements = {
              "perl Configure ios64-xcrun -miphoneos-version-min=18.0":
              'perl Configure ios64-xcrun -miphoneos-version-min=${CMAKE_OSX_DEPLOYMENT_TARGET}',
              "perl Configure iossimulator-xcrun -miphonesimulator-version-min=18.0":
              'perl Configure iossimulator-xcrun -miphonesimulator-version-min=${CMAKE_OSX_DEPLOYMENT_TARGET}',
          }

          changed = 0
          for old, new in replacements.items():
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  changed += count

          if changed == 0:
              print("Expected OpenSSL commands not found.")
              print("The source may have changed; refusing to claim the patch was applied.")
              raise SystemExit(1)

          path.write_text(text)
          print(f"Updated {changed} OpenSSL deployment-target command(s).")
          PY

          git -C source diff -- external/CMakeLists.txt

      - name: Configure iOS arm64 build
        env:
          IOS_TARGET: ${{ inputs.ios_deployment_target }}
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S source -B source/build-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DIOS=ON \
            -DARCHITECTURE=arm64

      - name: Show available build targets
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build source/build-ios --config Release -- -list

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build source/build-ios \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)" \
            2>&1 | tee build.log

      - name: Locate and package app
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$(find source/build-ios -type d \
            -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            find source/build-ios -maxdepth 6 \
              \( -name '*.app' -o -name '*.framework' \) -print
            exit 1
          fi

          echo "Found app: $APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist" || true

          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          (
            cd package
            /usr/bin/zip -qry ../Vion-unsigned.ipa Payload
          )

          test -s Vion-unsigned.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vion-ios-build-logs
          path: |
            build.log
            source/build-ios/CMakeFiles/CMakeOutput.log
            source/build-ios/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vion-iOS-unsigned
          path: Vion-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
